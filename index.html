    <script>
      // Apply the saved theme before first paint so light-theme users don't see a dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('river.v1.settings') || '{}')
        if (s.theme === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
    <style>#splash{z-index:100;background:radial-gradient(90% 70% at 20% 10%,#1fa9712e,#0000 60%),linear-gradient(160deg,#123d2d,#0f1412 65%);place-items:center;transition:opacity .35s;display:grid;position:fixed;inset:0}#splash img{width:min(56vw,260px);height:auto;animation:.5s ease-out both splash-in}#splash .light{display:none}[data-theme=light] #splash{background:linear-gradient(160deg,#e3ede5,#f6f2e8 65%)}[data-theme=light] #splash .dark{display:none}[data-theme=light] #splash .light{display:block}#splash.hide{opacity:0;pointer-events:none}@keyframes splash-in{0%{opacity:0;transform:translateY(6px)scale(.98)}}@media (prefers-reduced-motion:reduce){#splash,#splash img{transition:none;animation:none}}</style>
